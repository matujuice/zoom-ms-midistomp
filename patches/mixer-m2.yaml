    addr: 0xC00F2818
    expect: "2a101000ea076000"
    data: "2a203000ea076000"
    source: asm/mixer/cc_link.S
  # settings.S menu_draw: the seven names in MENU7 (PERFORM MODE instead of MIDI SETTINGS, MASTER and KALEIDO last)
