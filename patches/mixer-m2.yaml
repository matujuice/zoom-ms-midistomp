    addr: 0xC00CB284
    expect: "93d5e01f"
    data: "13bd5910"
  # PEDAL INPUT: screen 1 (SETTINGS) key table entry -> chain_vec.asm +32 (settings_key)
  - model: ms70cdr-2.10
    addr: 0xC00EEFA0
    expect: "50ea8111"   # midi-settings.yaml's settings_keys_e
    data: "20800fc0"
  # PEDAL INPUT: screen 1 draw table entry -> +40 (settings_draw, nine rows)
  - model: ms70cdr-2.10
    addr: 0xC00EEBB4
    expect: "58ea8111"   # midi-settings.yaml's settings_draw
    data: "28800fc0"
  # MIDI: screen 14 key table entry -> +144 (midi_key: knob 3 changes the row's value)
  - model: ms70cdr-2.10
    addr: 0xC00EEFD4
    expect: "60ea8111"   # midi-settings.yaml's midi_keys_e
    data: "90800fc0"
