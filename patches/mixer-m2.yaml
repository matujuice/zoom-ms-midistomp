  # midi_clock's poll trampoline -> the mixer poll (vector +120: LIMIT tag), then poll.S,
  # or looper.S poll_pre when looper.yaml went first (mixer.S checks its services magic)
  - model: ms70cdr-2.10
    addr: 0xC00C82D0
    expect: ["2a007400eac008006203000000800000", "2a001100ea0760006203000000800000"]   # midi-clock.yaml's, looper.yaml's
    data: "2a3c3000ea0760006203000000800000"
