    addr: 0xC00AE680
    expect: "93be1310"
    data: "13338f10"
  # callp IS_DIRTY -> dirty (+32)
  - model: ms70cdr-2.10
    addr: 0xC00A7E50
    expect: "92de2010"
    data: "123c9c10"
  # callp IS_DIRTY -> dirty (+32)
  - model: ms70cdr-2.10
    addr: 0xC00A7FD8
    expect: "92ae2010"
    data: "120c9c10"
  # AUTO SAVE's check: tempo-hold already hooks its callp (0xC00ACBC4), so
  # retarget that hook's JUMP IS_DIRTY (hold2.S dirty_hook) -> dirty (+32)
