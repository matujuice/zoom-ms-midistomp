# Mixer Mode M2 + M3a (docs/dev/mixer-mode-plan.md): the bus engine with the node
# settings, saved per patch, on the MIXER screen and MIDI CC 85-101. MS-70CDR 2.10
# OS. Test builds only. M3a: every slot has a bus saved per patch, which follows
# the effect when it is moved, added or deleted. M3b: the Effect Chain screen
# (screen 3) rebuilt as the mockup, in C (asm/mixer/chain_*.c), sets the buses.
# Serial (the default, and every patch saved without Mixer Mode) runs the
# chain as stock.
# Build: the release set (scripts/midistomp_builder.py PATCHES), m0-probe.yaml,
# then this patch. Not with m0-probe-chain.yaml (same packet at 0x1181BE00).
# Design: asm/mixer/mixer.S. The section hex is generated by
# scripts/build_mixer_ui.py --write (TI CGT) and tests/test_mixer_patch.py
# checks it still matches the source.
name: mixer-m2
description: Mixer Mode M2/M3a bus engine with node settings and saved buses, MIXER screen, CC 85-101
builds: [ms70cdr-2.10]
write:
  # Audio block: the slot loop's first fetch packet -> engine (+ 4 zero words)
  - model: ms70cdr-2.10
    addr: 0x1181BE00
    expect: "2a9874026a076002270446567f9000005aa300026e0c07b5132a0010200080e4"
    data: "2a00b00fea07e00f62037c000080000000000000000000000000000000000000"
    source: asm/mixer/chain_jump.S
  # Patch record save wrapper (every patch save) -> rec_save (vector +40)
  - model: ms70cdr-2.10
    addr: 0xC00B84C0
    expect: "f654bc0192a6f81f2606f7716e6cefa110005210d80f900528546105000080e1"
    data: "2a143000ea076000620300000080000010005210d80f90052854610500000000"
    source: asm/mixer/rec_save_jump.S
  # Patch load into the live patch: callp unpack -> unpack_live (+8)
  - model: ms70cdr-2.10
    addr: 0xC00B8964
    expect: "9326ff1f"
    data: "13d57a10"
  # Editor store, the saved copy: callp unpack -> unpack_saved (+16)
  - model: ms70cdr-2.10
    addr: 0xC00AE2EC
    expect: "93f61310"
    data: "13a68f10"
  # Patch dump to an editor: callp pack -> pack_dump (+24)
  - model: ms70cdr-2.10
    addr: 0xC00AE680
    expect: "93be1310"
    data: "13338f10"
  # callp IS_DIRTY -> dirty (+32)
  - model: ms70cdr-2.10
    addr: 0xC00A7E50
    expect: "92de2010"
    data: "123c9c10"
  # callp IS_DIRTY -> dirty (+32)
  - model: ms70cdr-2.10
    addr: 0xC00A7FD8
    expect: "92ae2010"
    data: "120c9c10"
  # AUTO SAVE's check: tempo-hold already hooks its callp (0xC00ACBC4), so
  # retarget that hook's JUMP IS_DIRTY (hold2.S dirty_hook) -> dirty (+32)
  - model: ms70cdr-2.10
    addr: 0x1181FF80
    expect: "2a9a4200ea056000"
    data: "2a103000ea076000"
  # callp IS_DIRTY -> dirty (+32), UI refresh / AUTO SAVE
  - model: ms70cdr-2.10
    addr: 0xC00ACD88
    expect: "92f61610"
    data: "12549210"
  # Effect Chain screen move: callp 0xC00B6BC4 (swap two rows) -> mv_swap (+96)
  - model: ms70cdr-2.10
    addr: 0xC00B76A4
    expect: "93a4fe1f"
    data: "13387d10"
  # Screen 33 ENTER (add an effect): callp 0xC00C22F4 -> mv_add (+104)
  - model: ms70cdr-2.10
    addr: 0xC00A7BE0
    expect: "93e23410"
    data: "13919c10"
  # Screen 2 YES (delete an effect): callp 0xC00C2030 -> mv_delete (+112)
  - model: ms70cdr-2.10
    addr: 0xC00A8294
    expect: "12b63310"
    data: "12be9b10"
  # Screen 15 (unused by stock) key table entry -> keys_e (+48)
  - model: ms70cdr-2.10
    addr: 0xC00EEFD8
    expect: "10830ac0"
    data: "30600fc0"
  # Screen 15 draw table entry -> draw_e (+56)
  - model: ms70cdr-2.10
    addr: 0xC00EEBEC
    expect: "98930ac0"
    data: "38600fc0"
  # midi_cc handler.S: CCs outside 14-73 go to cc (+64), which passes all but 85-101 on to step.S
