    addr: 0x1181EF78
    expect: "2ac07502eac0080258a31403"
    data: "2a623002ea07600258a31c03"
    source: asm/mixer/menu_draw.S
  # settings.S midi_keys EXIT: back to SETTINGS on its MIDI row (pedal_in.c), not the menu
