  - model: ms70cdr-2.10
    addr: 0x1181F0F0
    expect: "58a30c00786a800058a31000786a000158a3380258a324a25aa30002f82f8800"
    data: "285cb002e807e002d82a8c00146a14025aa30002006000000000000034e29401"
    source: asm/mixer/menu_enter.S
  # midi_clock's poll trampoline -> the mixer poll (vector +120: LIMIT tag), then poll.S,
  # or looper.S poll_pre when looper.yaml went first (mixer.S checks its services magic)
  - model: ms70cdr-2.10
    addr: 0xC00C82D0
    expect: ["2a007400eac008006203000000800000", "2a001100ea0760006203000000800000"]   # midi-clock.yaml's, looper.yaml's
    data: "2a3c3000ea0760006203000000800000"
    source: asm/mixer/poll_trampoline.S
  # M3b: screen 3 (Effect Chain) key table entry -> chain_vec.asm +0 (chain_key)
  - model: ms70cdr-2.10
    addr: 0xC00EEFA8
    expect: "a0830ac0"
    data: "00800fc0"
  # M3b: screen 3 draw table entry -> chain_vec.asm +8 (chain_draw_h)
