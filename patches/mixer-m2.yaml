  - model: ms70cdr-2.10
    addr: 0x1181F0F0
    expect: "58a30c00786a800058a31000786a000158a3380258a324a25aa30002f82f8800"
    data: "285cb002e807e002d82a8c00146a14025aa30002006000000000000034e29401"
