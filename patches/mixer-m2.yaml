  - model: ms70cdr-2.10
    addr: 0xC00ACD88
    expect: "92f61610"
    data: "12549210"
  # Effect Chain screen move: callp 0xC00B6BC4 (swap two rows) -> mv_swap (+96)
  - model: ms70cdr-2.10
    addr: 0xC00B76A4
    expect: "93a4fe1f"
    data: "13387d10"
