# DEBUG BUILD ONLY, never released: MS-70CDR detection probe (p2).
#   About 1 s after boot GPIO 52 and 90 become inputs; 256 ms later McASP pin
#   AXR4 is read as an input 20000 times. The VERSION menu entry then shows "T" +
#   the transitions counted, the version screen title the GPIO 52 and 90 levels
#   and the samples read high. With no AXR4 activity 52 and 90 go back to outputs.
#   Design: asm/cdr_probe/probe.S, docs/ms70cdr-port.md.
# Apply last, after looper (it retargets looper's poll trampoline; probe.S then
# jumps on to looper.S poll_pre). Hex from
#   zoomms asm asm/cdr_probe/<file> --addr <addr>   (add --section for the section)
name: cdr-probe
description: DEBUG MS-70CDR detection probe (AXR4 activity count on the VERSION menu entry)
builds: [ms50g-3.10]
write:
  # Transport poll trampoline (looper.yaml) -> probe
  - model: ms50g-3.10
    addr: 0xC00C8050
    expect: "2a001100ea0760006203000000800000"
    data: "2a001400ea0760006203000000800000"
    source: asm/cdr_probe/trampoline.S
section:
  # In DDR RAM test region 1 after looper.S (which ends at 0xC00F2800)
  - model: ms50g-3.10
    addr: 0xC00F2800
    source: asm/cdr_probe/probe.S
