# RAM canary test (issue #19), diagnostic build only, never released.
# Fills the RAM the space audit (issue #19) found unreferenced with a pattern once
# after boot; the VERSION screen (renamed RAMTEST) shows, per region, how
# many words changed since. Apply after midi-clock.yaml (it takes over that
# patch's poll call) and instead of a version-*.yaml.
# Source: asm/ram_test/ramtest.S
#   zoomms asm asm/ram_test/ramtest.S --addr 0xC00F1960 --section
name: ram-test
description: Fill free RAM at boot, count changed words on the VERSION screen
builds: [ms50g-3.10]
replace:
  - find: "VERSION\0"
    with: "RAMTEST\0"
    count: 2   # the menu list and the screen title
write:
  # Task_SwitchNrmlSpdRead's 16 ms round: callp poll trampoline -> ram_poll (fills once, then the poll)
  - model: ms50g-3.10
    addr: 0xC00CA630
    expect: "1246fb1f"
    data: "12684e10"
  # Screen 9 (VERSION) draw stub: callp 0xC00A8474 -> ram_draw
  - model: ms50g-3.10
    addr: 0xC00A9434
    expect: "920afe1f"
    data: "12be9010"
section:
  # In DDR right after the OS image; the first test region starts at 0xC00F2000
  - model: ms50g-3.10
    addr: 0xC00F1960
    data: ""
    source: asm/ram_test/ramtest.S
