name: cpu-360f
description: CPU 300 -> 360 MHz, SDRAM 120 MHz on SYSCLK5 (run-time PLL switch, hardware-proven 51ba9bb); DSP Full limit 300 -> 340 (comes after dsp-limit)
builds: [ms70cdr-2.10]
# Zoom's bootloader skips MAIN's AIS PLL/SDRAM commands, so the clock is switched by code that
# runs before the OS: MAIN's AIS jumps to it in L2 and it jumps on to c_int00
# (asm/overclock/pll_sc5.inc, docs/dev/overclock-plan.md). Update mode (Up + Down while plugging
# in USB) never runs it, so a pedal that hangs still recovers.
boot:
  - model: ms70cdr-2.10
    jump: 0x11816000         # pll_boot, then c_int00
    expect: 0xC00DD800
section:
  # L2 just below MAIN's own L2 sections (0x11817000); free at boot, the OS reuses it after.
  - model: ms70cdr-2.10
    addr: 0x11816000
    data: ""
    source: asm/overclock/pll360f_sc5.S
write:
  - model: ms70cdr-2.10
    addr: 0xC00BB52C         # mvkh imm of the DSP Full limit float: 300.0 -> 340.0 (~1.2 x 0.95)
    expect: "6acb2102"
    data: "6ad52102"
