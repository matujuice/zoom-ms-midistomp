name: cpu-360f
description: CPU 300 -> 360 MHz, SDRAM 120 MHz; DSP Full limit 300 -> 340 (comes after dsp-limit)
builds: [ms70cdr-2.10]
# Boot-time clock in MAIN's AIS script (docs/dev/overclock-plan.md). The bootloader keeps
# 300 MHz, so update mode (Up + Down while plugging in USB) still recovers a pedal that hangs.
boot:
  - model: ms70cdr-2.10
    function: 5              # PLL: PLLM 14, POSTDIV /1 -> 24 x 15 = 360 MHz
    expect: [0x18010202, 0x000501B9, 0x2]
    data:   [0x0E000302, 0x000701B9, 0x2]
  - model: ms70cdr-2.10
    set: 0x01C14188          # CFGCHIP3: EMIFB clock from SYSCLK5 (120 MHz) instead of stock 5
    expect: 5
    data: 0
  - model: ms70cdr-2.10
    function: 2              # SDRAM: SDCR, SDTIM1, SDTIM2 unchanged; refresh 120 x 15.6 - 1
    expect: [0x0001C620, 0x10913208, 0x30080006, 0x81F]
    data:   [0x0001C620, 0x10913208, 0x30080006, 0x74F]
write:
  - model: ms70cdr-2.10
    addr: 0xC00BB52C         # mvkh imm of the DSP Full limit float: 300.0 -> 340.0 (~1.2 x 0.95)
    expect: "6acb2102"
    data: "6ad52102"
