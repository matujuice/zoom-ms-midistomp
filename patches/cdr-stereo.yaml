# TEST BUILD, MS-70CDR only (owner's pedal), never released: true stereo input.
#   The R jack's ADC (McASP AXR4) is routed and read as on the MS-70CDR 2.10 OS, and the
#   70CDR input stages (deinterleave, dual-range combine + DC blocker, to float) feed the
#   chain L and R inputs separately. Always on, no mono fallback (R = R jack).
#   Do not flash on an MS-50G/60B: there AXR4/GPIO 52 have an unknown board role.
# Design, addresses and what is confirmed: docs/ms70cdr-port.md, "Stereo input patch (test build)".
# Apply after looper (its section ends at 0xC00F2800). Hex from
#   zoomms asm asm/cdr_stereo/<file> --addr <addr>   (add --section for the section);
# the compact (16-bit) edits and the callp are hand-encoded, tests/test_cdr_stereo_patch.py checks them.
name: cdr-stereo
description: TEST MS-70CDR true stereo input (AXR4 + 70CDR input stages)
builds: [ms50g-3.10]
write:
  # PINMUX10[23:20] = 1: pad AXR0_4 to McASP AXR4 instead of GPIO 52 (compact set .S2 b0,23,23,b0
  # -> set .S2 b0,20,20,b0, the 70CDR halfword)
  - model: ms50g-3.10
    addr: 0x11818274
    expect: "23f0"
    data: "2390"
  # GPIO init: bank 3 DIR 0x1020 -> 0x1030, GPIO 52 is an input (compact mvk .S2 32,b0 -> 48,b0)
  - model: ms50g-3.10
    addr: 0xC00CE292
    expect: "3300"
    data: "3310"
  # McASP init: RFMT = 0x000180F0 (RBUSEL = 0, RX through the DMA port)
  - model: ms50g-3.10
    addr: 0xC00C3210
    expect: "287c4000"
    data: "28784000"
    source: asm/cdr_stereo/rfmt.S
  # McASP init: stw b1,*+a4(124) (RINTCTL = 0, now done in stereo.S boot) -> set a0,3,3,a0 (XFMT stays 0x000180F8)
  - model: ms50g-3.10
    addr: 0xC00C323C
    expect: "76e29300"
    data: "88630000"
    source: asm/cdr_stereo/xfmt.S
  # McASP init: PFUNC = 0x0200FF8F (AXR4 is McASP)
  - model: ms50g-3.10
    addr: 0xC00C32A0
    expect: "aacfff036a808103"
    data: "aac7ff036a008103"
    source: asm/cdr_stereo/pfunc.S
  # McASP init: PDIR = 0x1600FFCF (AXR4 is an input)
  - model: ms50g-3.10
    addr: 0xC00C32AC
    expect: "a8ef7f00"
    data: "a8e77f00"
    source: asm/cdr_stereo/pdir.S
  # 0xC00C5BA0 (called by the McASP init): RX PaRAM 0 DST reset 0x11F034F8 -> new buffer A 0x11F03B80
  - model: ms50g-3.10
    addr: 0xC00C5BB8
    expect: "287c1a00"
    data: "28c01d00"
    source: asm/cdr_stereo/rx_reset.S
  # Boot: callp McASP init 0xC00C31A4 -> callp stereo.S boot 0xC00F2800 (which calls the McASP init)
  - model: ms50g-3.10
    addr: 0xC00D47F8
    expect: "9238dd1f"
    data: "12043c10"
  # L2 audio call list: callp rx_deint, in_combine, to_float -> far jump to stereo.S stereo_in
  - model: ms50g-3.10
    addr: 0x1181BD6C
    expect: "92d1ff1f1270ff1f1240ff1f"
    data: "2a801400ea07600062a38000"
    source: asm/cdr_stereo/call_list.S
section:
  # In DDR RAM test region 1 after looper.S (which ends at 0xC00F2800): boot at +0, stereo_in at +0x100
  - model: ms50g-3.10
    addr: 0xC00F2800
    source: asm/cdr_stereo/stereo.S
