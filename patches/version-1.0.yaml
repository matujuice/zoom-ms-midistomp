# MIDISTOMP V1.0: the VERSION menu entry reads "V1.0", and the boot screen
# prints "v1.0" under the MIDISTOMP MOD logo instead of the OS version.
name: version-1.0
description: VERSION entry reads "V1.0"; boot screen version line reads "v1.0"
replace:
  - find: "VERSION\0"
    with: "V1.0\0\0\0\0"
    count: 2   # the menu list and the version screen title
section:
  # "v1.0", in DDR the RAM test (#19) found unused
  - model: ms50g-3.10
    addr: 0xC00F2000
    data: "76312e3000000000"
write:
  # Boot screen: sprintf(buf, "v%s", version) -> format = our "v1.0" string.
  # mvk/mvkh .S2 0xC00E4DB4,b0 -> 0xC00F2000 (keeps the mvkh parallel bit)
  - model: ms50g-3.10
    addr: 0xC00CD960
    expect: "2ada26006b076000"
    data: "2a001000eb076000"
