# Looper services (v2.0 step 2), for the Looper ZDL. MS-70CDR 2.10 OS.
#   Big buffer: free RAM regions 3, 2 and 1 (3.3 MB with the looper's own slot
#   block), handed over in the services block at 0xC00F3000 (magic 0x5A4C5301).
#   With the looper under the cursor the footswitch counts a press instead of
#   flipping it, and a hold does nothing; its on/off CC counts a press for
#   values 64-127. The looper drives the LED while it is under the cursor, and
#   its Effect View gets a status box (text, progress bar and pulse from the ZDL).
# Design and addresses: docs/dev/os-reverse-engineering.md, "Looper services";
# block layout: docs/dev/looper-services.md.
# Apply after midi-cc, midi-clock and tempo-hold (it retargets their trampolines).
# With mixer-m2, apply this first: the mixer poll then chains poll_pre.
# The hex below is generated from asm/looper/*.S with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_looper_patch.py checks it still matches the source.
name: looper
description: Looper services (big buffer, footswitch/CC presses, LED, status box) for the Looper ZDL
builds: [ms70cdr-2.10]
write:
  # Transport poll trampoline (midi-clock.yaml) -> poll_pre
  - model: ms70cdr-2.10
    addr: 0xC00C82D0
    expect: "2a007400eac008006203000000800000"
    data: "2a001100ea0760006203000000800000"
    source: asm/looper/poll_trampoline.S
  # Footswitch flip trampoline (tempo-hold.yaml) -> toggle_pre
  - model: ms70cdr-2.10
    addr: 0xC00D2F30
    expect: "2a4c7d00eac008006203000000800000"
    data: "2a041100ea0760006203000000800000"
    source: asm/looper/toggle_trampoline.S
  # Footswitch hold trampoline (tempo-hold.yaml) -> hold_pre
  - model: ms70cdr-2.10
    addr: 0xC00D4270
    expect: "2a907f00eac008006203000000800000"
    data: "2a081100ea0760006203000000800000"
    source: asm/looper/hold_trampoline.S
  # MIDI CC trampoline (midi-cc.yaml) -> cc_pre
  - model: ms70cdr-2.10
    addr: 0xC00BB190
    expect: "2a001400ea0760006203000000800000"
    data: "2a0c1100ea0760006203000000800000"
    source: asm/looper/cc_trampoline.S
  # Call before the LCD send (callp 0xC00D5720 || ldw *+b14(708) -> a4) -> the status
  # bar's C (lbox.c lbox_draw, 0xC00F5400; looper.S draw_pre was removed)
  # (hand-encoded callp, displacement from the fetch packet 0xC00BB0E0)
  - model: ms70cdr-2.10
    addr: 0xC00BB0EC
    expect: "13c83410"
    data: "13647410"
