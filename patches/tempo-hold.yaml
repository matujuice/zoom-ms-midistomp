# Tempo screen, HOLD FOR MOMENTARY and button combos (issue #28, v0.6).
# MS-70CDR 2.10 OS (addresses: docs/dev/ms70cdr-addresses.md). Apply after midi-settings.yaml (HOLD FOR's
# choice screen and V_HOLDM live there).
#   Tempo screen: knob 1 turns the tempo, TURN OR TAP / MIDI CLOCK line,
#   closes 2 s after the last turn or tap; the TAP softkey reads TEMPO.
#   HOLD FOR MOMENTARY; BOTTOM + RIGHT opens the tuner, BOTTOM + LEFT the
#   tempo screen. In the tuner the middle knob (labelled EXIT) leaves it.
# Design and addresses: docs/dev/os-reverse-engineering.md, "Tempo screen,
# HOLD FOR and combos". The hex below is generated from asm/tempo_hold/*.S
# with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_tempo_hold_patch.py checks it still matches the source.
name: tempo-hold
description: Tempo screen knob, HOLD FOR MOMENTARY, tuner and tempo combos
builds: [ms70cdr-2.10]
write:
  # Footswitch press with the tempo screen open: never flips, whatever
  # HOLD FOR says (callp HOLD FOR getter -> mvk .S1 1,a4)
  - model: ms70cdr-2.10
    addr: 0xC00ACAB8
    expect: "12231b10"
    data: "a8000002"
  # Footswitch release with the tempo screen open: always taps (same)
  - model: ms70cdr-2.10
    addr: 0xC00AC920
    expect: "12531b10"
    data: "a8000002"
  # Tempo screen (state 2) timeout: set a6,0,30,a6 (forever) -> mvk .S1 2000,a6
  - model: ms70cdr-2.10
    addr: 0xC00CCCC8
    expect: "891e1803"
    data: "29e80303"
  # Tempo box (x, y, w, h halfwords, only the tempo screen uses it): y 29 h 26
  # -> y 27 h 37, down to the bottom row, so our line fits inside it
  - model: ms70cdr-2.10
    addr: 0xC00EB700
    expect: "04001d0078001a00"
    data: "04001b0078002500"
  # Softkey label "TAP" (0xC00EC8CF) -> "TEMPO" (0xC00EB0DC, the tempo box title)
  - model: ms70cdr-2.10
    addr: 0xC00CB2A8
    expect: "aa676402"
    data: "2a6e5802"
  # Call site: the overlay draw for states 2 and 5 (stock 0xC00AAB10) -> tempo_draw trampoline
  - model: ms70cdr-2.10
    addr: 0xC00BB050
    expect: "135adf1f"
    data: "93bd2010"
  - model: ms70cdr-2.10
    addr: 0xC00CB62C
    expect: "00000000000000000000000000000000"
    data: "2a407d00eac008006203000000800000"
    source: asm/tempo_hold/tempo_draw_trampoline.S
  # Call site: the key loop's knob turn call (stock 0xC00AC0E8) -> knob trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACFE8
    expect: "1321fe1f"
    data: "13f24810"
  - model: ms70cdr-2.10
    addr: 0xC00D1770
    expect: "00000000000000000000000000000000"
    data: "2a447d00eac008006203000000800000"
    source: asm/tempo_hold/knob_trampoline.S
  # Call site: the knob press tap (stock 0xC00BA488) -> tap trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AC8D0
    expect: "12791b10"
    data: "12664a10"
  # Call site: the footswitch release tap -> tap trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AC930
    expect: "126d1b10"
    data: "125a4a10"
  - model: ms70cdr-2.10
    addr: 0xC00D1BF0
    expect: "00000000000000000000000000000000"
    data: "2a487d00eac008006203000000800000"
    source: asm/tempo_hold/tap_trampoline.S
  # Call site: the footswitch press flip (stock 0xC00ABCB8) -> toggle trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACB0C
    expect: "1237fe1f"
    data: "12864c10"
  - model: ms70cdr-2.10
    addr: 0xC00D2F30
    expect: "00000000000000000000000000000000"
    data: "2a4c7d00eac008006203000000800000"
    source: asm/tempo_hold/toggle_trampoline.S
  # Call site: the key loop's footswitch release call (stock 0xC00AC8FC) -> release trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AD1B8
    expect: "93ebfe1f"
    data: "132a4d10"
  - model: ms70cdr-2.10
    addr: 0xC00D3AF0
    expect: "00000000000000000000000000000000"
    data: "2a507d00eac008006203000000800000"
    source: asm/tempo_hold/release_trampoline.S
  # Call site: the key loop's type hold call, event 228 (stock 0xC00ABA58) -> combo trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACF6C
    expect: "135ffd1f"
    data: "13264e10"
  # event 229 too -> combo trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACF40
    expect: "1363fd1f"
    data: "132a4e10"
  # Call site: the cursor hold call, events 230/231 (stock 0xC00AB968) -> combo trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACF10
    expect: "134dfd1f"
    data: "13324e10"
  - model: ms70cdr-2.10
    addr: 0xC00D4090
    expect: "00000000000000000000000000000000"
    data: "2a547d00eac008006203000000800000"
    source: asm/tempo_hold/combo_trampoline.S
  # Call site: the key loop's footswitch hold call, event 224 (stock 0xC00ABD30) -> hold trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACFC0
    expect: "13aefd1f"
    data: "13564e10"
  - model: ms70cdr-2.10
    addr: 0xC00D4270
    expect: "00000000000000000000000000000000"
    data: "2a907f00eac008006203000000800000"
    source: asm/tempo_hold/hold_trampoline.S
  # Call site: AUTO SAVE's patch-changed check (stock 0xC00B8534) -> dirty trampoline
  - model: ms70cdr-2.10
    addr: 0xC00ACBC4
    expect: "922e1710"
    data: "127e4f10"
  - model: ms70cdr-2.10
    addr: 0xC00D47B0
    expect: "00000000000000000000000000000000"
    data: "2a947f00eac008006203000000800000"
    source: asm/tempo_hold/dirty_trampoline.S
  # Call site: the type button release calls, events 69/71 (stock 0xC00AC450) -> swallow trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AD0D8
    expect: "1372fe1f"
    data: "13c65610"
  # event 71 too -> swallow trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AD088
    expect: "137afe1f"
    data: "13ce5610"
  # Call site: the cursor release call, events 73/75 (stock 0xC00AC30C) -> swallow trampoline
  - model: ms70cdr-2.10
    addr: 0xC00AD038
    expect: "935dfe1f"
    data: "13da5610"
  - model: ms70cdr-2.10
    addr: 0xC00D86F0
    expect: "00000000000000000000000000000000"
    data: "2a987f00eac008006203000000800000"
    source: asm/tempo_hold/swallow_trampoline.S
  # Middle knob release (event 65, stock 0xC00AC790) -> tuner_exit
  - model: ms70cdr-2.10
    addr: 0xC00AD170
    expect: "13c6fe1f"
    data: "13765710"
  - model: ms70cdr-2.10
    addr: 0xC00D8D10
    expect: "00000000000000000000000000000000"
    data: "2ae07300eac008006203000000800000"
    source: asm/tempo_hold/tuner_exit_trampoline.S
  # Tuner screen, middle knob softkey (stock 0xC009F8F0 with a blank label) -> EXIT
  - model: ms70cdr-2.10
    addr: 0xC00BAD40
    expect: "1376c91f"
    data: "139e3f10"
  - model: ms70cdr-2.10
    addr: 0xC00DAA30
    expect: "00000000000000000000000000000000"
    data: "2a7e48026a07600212da890f00800000"
    source: asm/tempo_hold/tuner_label_trampoline.S
