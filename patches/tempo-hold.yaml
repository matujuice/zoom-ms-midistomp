# Tempo screen, HOLD FOR MOMENTARY and button combos (issue #28, v0.6).
# MS-50G 3.10 OS only for now. Apply after midi-settings.yaml (HOLD FOR's
# choice screen and V_HOLDM live there).
#   Tempo screen: knob 1 turns the tempo, TURN OR TAP / MIDI CLOCK line,
#   closes 2 s after the last turn or tap; the TAP softkey reads TEMPO.
#   HOLD FOR MOMENTARY; BOTTOM + RIGHT opens the tuner, BOTTOM + LEFT the
#   tempo screen.
# Design and addresses: docs/os-reverse-engineering.md, "Tempo screen,
# HOLD FOR and combos". The hex below is generated from asm/tempo_hold/*.S
# with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_tempo_hold_patch.py checks it still matches the source.
name: tempo-hold
description: Tempo screen knob, HOLD FOR MOMENTARY, tuner and tempo combos
builds: [ms50g-3.10]
write:
  # Footswitch press with the tempo screen open: never flips, whatever
  # HOLD FOR says (callp HOLD FOR getter -> mvk .S1 1,a4)
  - model: ms50g-3.10
    addr: 0xC00ACBD8
    expect: "12231a10"
    data: "a8000002"
  # Footswitch release with the tempo screen open: always taps (same)
  - model: ms50g-3.10
    addr: 0xC00ACA40
    expect: "12531a10"
    data: "a8000002"
  # Tempo screen (state 2) timeout: set a6,0,30,a6 (forever) -> mvk .S1 2000,a6
  - model: ms50g-3.10
    addr: 0xC00CB96C
    expect: "891e1803"
    data: "29e80303"
  # Softkey label "TAP" (0xC00ECDC7) -> "TEMPO" (0xC00EB13F, the tempo box title)
  - model: ms50g-3.10
    addr: 0xC00CB3C8
    expect: "aae36602"
    data: "aa9f5802"
  # Call site: the overlay draw for states 2 and 5 (stock 0xC00AAC48) -> tempo_draw trampoline
  - model: ms50g-3.10
    addr: 0xC00BA930
    expect: "1365e01f"
    data: "132a2210"
  - model: ms50g-3.10
    addr: 0xC00CBA70
    expect: "00000000000000000000000000000000"
    data: "2a407d00eac008006203000000800000"
    source: asm/tempo_hold/tempo_draw_trampoline.S
  # Call site: the key loop's knob turn call (stock 0xC00AC214) -> knob trampoline
  - model: ms50g-3.10
    addr: 0xC00AD10C
    expect: "9322fe1f"
    data: "13564910"
  - model: ms50g-3.10
    addr: 0xC00D1BB0
    expect: "00000000000000000000000000000000"
    data: "2a447d00eac008006203000000800000"
    source: asm/tempo_hold/knob_trampoline.S
  # Call site: the knob press tap (stock 0xC00B9DA8) -> tap trampoline
  - model: ms50g-3.10
    addr: 0xC00AC9F0
    expect: "12791a10"
    data: "12ca4a10"
  # Call site: the footswitch release tap -> tap trampoline
  - model: ms50g-3.10
    addr: 0xC00ACA50
    expect: "126d1a10"
    data: "12be4a10"
  - model: ms50g-3.10
    addr: 0xC00D2030
    expect: "00000000000000000000000000000000"
    data: "2a487d00eac008006203000000800000"
    source: asm/tempo_hold/tap_trampoline.S
  # Call site: the footswitch press flip (stock 0xC00ABDE4) -> toggle trampoline
  - model: ms50g-3.10
    addr: 0xC00ACC2C
    expect: "9238fe1f"
    data: "12ea4c10"
  - model: ms50g-3.10
    addr: 0xC00D3370
    expect: "00000000000000000000000000000000"
    data: "2a4c7d00eac008006203000000800000"
    source: asm/tempo_hold/toggle_trampoline.S
  # Call site: the key loop's footswitch release call (stock 0xC00ACA1C) -> release trampoline
  - model: ms50g-3.10
    addr: 0xC00AD2D8
    expect: "93ebfe1f"
    data: "138e4d10"
  - model: ms50g-3.10
    addr: 0xC00D3F30
    expect: "00000000000000000000000000000000"
    data: "2a507d00eac008006203000000800000"
    source: asm/tempo_hold/release_trampoline.S
  # Call site: the key loop's type hold call, event 228 (stock 0xC00ABB80) -> combo trampoline
  - model: ms50g-3.10
    addr: 0xC00AD090
    expect: "1360fd1f"
    data: "138a4e10"
  # event 229 too -> combo trampoline
  - model: ms50g-3.10
    addr: 0xC00AD064
    expect: "1364fd1f"
    data: "138e4e10"
  # Call site: the cursor hold call, events 230/231 (stock 0xC00ABA90) -> combo trampoline
  - model: ms50g-3.10
    addr: 0xC00AD034
    expect: "134efd1f"
    data: "13964e10"
  - model: ms50g-3.10
    addr: 0xC00D44D0
    expect: "00000000000000000000000000000000"
    data: "2a547d00eac008006203000000800000"
    source: asm/tempo_hold/combo_trampoline.S
  # Call site: the key loop's footswitch hold call, event 224 (stock 0xC00ABE58) -> hold trampoline
  - model: ms50g-3.10
    addr: 0xC00AD0E4
    expect: "13affd1f"
    data: "13ba4e10"
  - model: ms50g-3.10
    addr: 0xC00D46B0
    expect: "00000000000000000000000000000000"
    data: "2a907f00eac008006203000000800000"
    source: asm/tempo_hold/hold_trampoline.S
  # Call site: AUTO SAVE's patch-changed check (stock 0xC00B87F4) -> dirty trampoline
  - model: ms50g-3.10
    addr: 0xC00ACCE4
    expect: "92621710"
    data: "12e24f10"
  - model: ms50g-3.10
    addr: 0xC00D4BF0
    expect: "00000000000000000000000000000000"
    data: "2a947f00eac008006203000000800000"
    source: asm/tempo_hold/dirty_trampoline.S
  # Call site: the type button release calls, events 69/71 (stock 0xC00AC574) -> swallow trampoline
  - model: ms50g-3.10
    addr: 0xC00AD1F8
    expect: "9372fe1f"
    data: "13325710"
  # event 71 too -> swallow trampoline
  - model: ms50g-3.10
    addr: 0xC00AD1A8
    expect: "937afe1f"
    data: "133a5710"
  # Call site: the cursor release call, events 73/75 (stock 0xC00AC434) -> swallow trampoline
  - model: ms50g-3.10
    addr: 0xC00AD158
    expect: "935efe1f"
    data: "13465710"
  - model: ms50g-3.10
    addr: 0xC00D8B70
    expect: "00000000000000000000000000000000"
    data: "2a987f00eac008006203000000800000"
    source: asm/tempo_hold/swallow_trampoline.S
