# Mixer Mode M0 hardware probes P1-P6, v2 (docs/dev/mixer-mode-m0.md, "Probe build:
# how to read it"). Diagnostic build only, never released. MS-70CDR 2.10 OS.
# Build: the release set (scripts/midistomp_builder.py PATCHES) plus this patch,
# then m0-probe-chain.yaml (the slot-loop hook; left out in mixer builds).
# Page 0 shows what is flashed (version, commit, date, label:
# filled in at build time, zoomms build --stamp); measuring runs only while the
# probe screen is open:
#   P1 CPU meter (TSCL around the audio block and each effect, rated against
#   the 54422-cycle block period; declared DSP total), P2 slot order, P3 what
#   each slot's effect writes (F, Acc, Dry), P4 patch-record bytes, P5 record
#   store, P6 the ctx pointers each slot gets and which of those buffers it
#   writes. The VERSION screen (menu entry M0PROBE) shows them; a knob turn
#   changes the page. No flash write, same audio. The DSP Full limit is raised
#   from 225 to 300 (probe build only) to measure heavier patches.
# Design: asm/m0_probe/probe.S. The hex below is generated from asm/m0_probe/*.S
# (zoomms asm <file> --addr <addr>, add --section for the section) and
# tests/test_m0_probe_patch.py checks it still matches the source.
name: m0-probe
description: M0 probe v2 screens (CPU meter, slot order, bus checks, ctx pointers, record checks) on the VERSION screen, DSP limit 300
builds: [ms70cdr-2.10]
replace:
  - find: "V1.2\0\0\0\0"
    with: "M0PROBE\0"
    count: 2   # the menu list and the version screen title (version-1.2.yaml)
write:
  # Audio block: far stub to the register save (callp at 0x1181BDE0) -> blk_start
  - model: ms70cdr-2.10
    addr: 0x1181BF60
    expect: "2a608a0f6a07e00f"
    data: "2a80980fea07e00f"
    source: asm/m0_probe/start_stub.S
  # Audio block: far stub to the register restore (callp at 0x1181BE5C) -> blk_end
  - model: ms70cdr-2.10
    addr: 0x1181BF40
    expect: "2a508a0f6a07e00f"
    data: "2a84980fea07e00f"
    source: asm/m0_probe/end_stub.S
  # DSP Full check 0xC00BB4E0: the limit 225.0f -> 300.0f (mvkh .S2 0x4361 -> 0x4396, b4)
  - model: ms70cdr-2.10
    addr: 0xC00BB52C
    expect: "eab02102"
    data: "6acb2102"
    source: asm/m0_probe/dsp_limit.S
  # Task_SwitchNrmlSpdRead's 16 ms round: callp poll trampoline -> probe_poll
  - model: ms70cdr-2.10
    addr: 0xC00C6998
    expect: "122a0310"      # midi-clock.yaml's callp
    data: "12f35810"
  # Screen 9 (VERSION) draw stub: callp 0xC00A8428 -> probe_draw
  - model: ms70cdr-2.10
    addr: 0xC00A93D0
    expect: "120dfe1f"
    data: "12ac9310"
  # Screen 9 key stub: callp 0xC00A7628 || lddw (event) -> probe_keys, parallel bit kept
  - model: ms70cdr-2.10
    addr: 0xC00A8364
    expect: "1359fe1f"
    data: "13b99510"
section:
  # Vectors, code, tables and variables, in DDR RAM test region 1 after the
  # looper services block (not in the release set)
  - model: ms70cdr-2.10
    addr: 0xC00F3100
    source: asm/m0_probe/probe.S
    stamp: {version: 7456, commit: 7472, date: 7488, label: 7504}   # 16-byte <key> placeholders the build fills
