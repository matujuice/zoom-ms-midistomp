# DIAGNOSTICS (docs/diagnostics-plan.md): a CPU badge on the MENU title bar and a
# 4-page dashboard (LOAD, EFFECTS, MODS, ABOUT) on the VERSION screen, renamed
# DIAGNOSTICS. Test builds only; it takes the m0 probe's place (never both).
# The audio timing is in asm/mixer/engine.c (mixer-m2.yaml, apply that first): it calls
# diag_end only while the magic word at 0xC00F3128 is there. The DSP Full limit is
# raised from 225 to 300 as in the probe build.
# The hex below is built from asm/diag/ by scripts/build_diag_ui.py (--write);
# tests/test_diag_patch.py checks it still matches.
name: diag
description: DIAGNOSTICS dashboard and MENU CPU badge (test builds), DSP limit 300
builds: [ms70cdr-2.10]
write:
  # DSP Full check 0xC00BB4E0: the limit 225.0f -> 300.0f (mvkh .S2 0x4361 -> 0x4396, b4)
  - model: ms70cdr-2.10
    addr: 0xC00BB52C
    expect: "eab02102"
    data: "6acb2102"
    source: asm/m0_probe/dsp_limit.S
  # Task_SwitchNrmlSpdRead's 16 ms round: callp poll trampoline -> diag_poll (vec +8)
  - model: ms70cdr-2.10
    addr: 0xC00C6998
    expect: "122a0310"      # midi-clock.yaml's callp
    data: "12f15810"
  # Screen 9 (VERSION) draw stub: callp 0xC00A8428 -> diag_draw (vec +16)
  - model: ms70cdr-2.10
    addr: 0xC00A93D0
    expect: "120dfe1f"
    data: "12aa9310"
  # Screen 9 key stub: callp 0xC00A7628 || lddw (event) -> diag_keys (vec +24), parallel bit kept
  - model: ms70cdr-2.10
    addr: 0xC00A8364
    expect: "1359fe1f"
    data: "13b79510"
  # Menu draw: midi-settings' callp 0xC00C1FC4 (the mixer menu draw) -> diag_menu (vec +32)
  - model: ms70cdr-2.10
    addr: 0xC00A9398
    expect: "92883110"
    data: "12b49310"
  # mixer.S MENU7 word 4: the VERSION entry's name -> "SYSTEM" (vec +128)
  - model: ms70cdr-2.10
    addr: 0xC00F60D4
    expect: "0d900ec0"
    data: "80310fc0"
  # Task_MIDI wakes up (after its pend): ldw *+b14(220),b0 -> callp diag_mw (vec +144)
  - model: ms70cdr-2.10
    addr: 0xC00AECCC
    expect: "6e370000"
    data: "129a8810"
  # End of its byte loop: midi-clock.yaml's callp clock_trampoline -> diag_me (vec +152),
  # which calls the trampoline itself
  - model: ms70cdr-2.10
    addr: 0xC00AEEE0
    expect: "126ee51f"
    data: "12578810"
