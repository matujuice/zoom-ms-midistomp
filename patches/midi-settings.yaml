# MIDI SETTINGS menu (issue #26, v0.5). MS-50G 3.10 OS only for now.
# Apply after midi-cc.yaml and midi-clock.yaml (it reroutes the CC call site
# those set up, and clock.S and poll.S use the word and vector kept here).
#   Menu gets a MIDI SETTINGS entry (CLOCK, TRANSPORT, PROG CH and CC
#   RECEIVE, PROG CH START NO., MIDI CHANNEL), saved in flash record 51;
#   SETTINGS gets TEMPO LOCK, saved with the stock settings.
# Design and addresses: docs/os-reverse-engineering.md, "MIDI SETTINGS".
# The hex below is generated from asm/midi_settings/*.S with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_midi_settings_patch.py checks it still matches the source.
name: midi-settings
description: MIDI SETTINGS menu (receive, PC start, channel) and TEMPO LOCK
builds: [ms50g-3.10]
write:
  # Key switch table, screen 1 (SETTINGS) -> settings_keys
  - model: ms50g-3.10
    addr: 0xC00EF300
    expect: "04840ac0"
    data: "50ea8111"
  # Draw switch table, screen 1 -> settings_draw
  - model: ms50g-3.10
    addr: 0xC00EF2BC
    expect: "64940ac0"
    data: "58ea8111"
  # Key switch table, screen 14 (unused by stock) -> midi_keys
  - model: ms50g-3.10
    addr: 0xC00EF334
    expect: "60830ac0"
    data: "60ea8111"
  # Draw switch table, screen 14 -> midi_draw
  - model: ms50g-3.10
    addr: 0xC00EF2F0
    expect: "00940ac0"
    data: "68ea8111"
  # Key switch table, screen 13 (unused by stock) -> opt_keys
  - model: ms50g-3.10
    addr: 0xC00EF330
    expect: "60830ac0"
    data: "70ea8111"
  # Draw switch table, screen 13 -> opt_draw
  - model: ms50g-3.10
    addr: 0xC00EF2EC
    expect: "00940ac0"
    data: "78ea8111"
  # Menu keys: the default stub's callp 0xC00A79B4 -> menu_keys
  - model: ms50g-3.10
    addr: 0xC00A8360
    expect: "93cafe1f"
    data: "13522d10"
  - model: ms50g-3.10
    addr: 0xC00BEDF0
    expect: "00000000000000000000000000000000"
    data: "2a207500eac008006203000000800000"
    source: asm/midi_settings/menu_keys_trampoline.S
  # Menu draw: the default stub's callp 0xC00A7460 -> menu_draw
  - model: ms50g-3.10
    addr: 0xC00A9400
    expect: "120cfc1f"
    data: "92ac3110"
  - model: ms50g-3.10
    addr: 0xC00C2164
    expect: "00000000000000000000000000000000"
    data: "2a247500eac008006203000000800000"
    source: asm/midi_settings/menu_draw_trampoline.S
  # Version screen EXIT: back to the menu on entry 4, not 3 (compact mvk .L2 3,b4 -> 4)
  - model: ms50g-3.10
    addr: 0xC00A7638
    expect: "2766"
    data: "2786"
  # Settings save: callp pack -> pack_hook
  - model: ms50g-3.10
    addr: 0xC00B9CF4
    expect: "93f13310"
    data: "1361ff1f"
  - model: ms50g-3.10
    addr: 0xC00B97E8
    expect: "00000000000000000000000000000000"
    data: "2a407500eac008006203000000800000"
    source: asm/midi_settings/pack_trampoline.S
  # Settings load at boot: callp unpack -> unpack_hook
  - model: ms50g-3.10
    addr: 0xC00BA09C
    expect: "13603310"
    data: "93580710"
  - model: ms50g-3.10
    addr: 0xC00BDB44
    expect: "00000000000000000000000000000000"
    data: "2a447500eac008006203000000800000"
    source: asm/midi_settings/unpack_trampoline.S
  # Record 51 (last patch) load at boot -> rec_load
  - model: ms50g-3.10
    addr: 0xC00B8DD4
    expect: "92f1f71f"
    data: "929d1710"
  - model: ms50g-3.10
    addr: 0xC00C4AAC
    expect: "00000000000000000000000000000000"
    data: "2a4c7500eac008006203000000800000"
    source: asm/midi_settings/rec_load_trampoline.S
  # Record 51 save -> rec_save
  - model: ms50g-3.10
    addr: 0xC00B86E0
    expect: "93b6f81f"
    data: "13d51a10"
  - model: ms50g-3.10
    addr: 0xC00C5D88
    expect: "00000000000000000000000000000000"
    data: "2a507500eac008006203000000800000"
    source: asm/midi_settings/rec_save_trampoline.S
  # Task_MIDI CC call site (midi-cc.yaml's trampoline) and PC call site
  # (stock midi_channel_msg) -> midi_gate
  - model: ms50g-3.10
    addr: 0xC00AF088
    expect: "13710010"
    data: "93e50710"
  - model: ms50g-3.10
    addr: 0xC00AF0AC
    expect: "130bfe1f"
    data: "93e10710"
  - model: ms50g-3.10
    addr: 0xC00B2FAC
    expect: "00000000000000000000000000000000"
    data: "2a487500eac008006203000000800000"
    source: asm/midi_settings/gate_trampoline.S
