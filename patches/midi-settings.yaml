# MIDI settings page (issue #26, v0.5). MS-50G 3.10 OS only for now.
# Apply after midi-cc.yaml and midi-clock.yaml (it reroutes the CC call site
# those set up and clock.S reads the flags it keeps).
#   Menu > SETTINGS gets four more rows, MIDI CLOCK, MIDI START/STOP,
#   MIDI PROG CHANGE and MIDI CC, each with an OFF/ON screen like AUTO SAVE.
#   All ON by default; saved with the stock settings.
# Design and addresses: docs/os-reverse-engineering.md, "MIDI settings page".
# The hex below is generated from asm/midi_settings/*.S with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_midi_settings_patch.py checks it still matches the source.
name: midi-settings
description: MIDI receive on/off for clock, Start/Stop, program change and CC in SETTINGS
builds: [ms50g-3.10]
write:
  # Key switch table, screen 1 (SETTINGS list) -> list_keys
  - model: ms50g-3.10
    addr: 0xC00EF300
    expect: "04840ac0"
    data: "00ea8111"
  # Key switch table, screen 13 (unused by stock) -> midi_keys
  - model: ms50g-3.10
    addr: 0xC00EF330
    expect: "60830ac0"
    data: "08ea8111"
  # Draw switch table, screen 13 -> midi_draw
  - model: ms50g-3.10
    addr: 0xC00EF2EC
    expect: "00940ac0"
    data: "10ea8111"
  # SETTINGS list draw: row names from our 11-entry table (mvkl/mvkh a1)
  - model: ms50g-3.10
    addr: 0xC00A8914
    expect: "28b4e6006807e000"
    data: "2820f500e8c08800"
  # ... row icons from our table (mvkl/mvkh b1)
  - model: ms50g-3.10
    addr: 0xC00A8930
    expect: "2ad4e2006a07e000"
    data: "2a38f500eac08800"
  # ... scrollbar for 11 rows (mvk .L2 7,b4 -> 11)
  - model: ms50g-3.10
    addr: 0xC00A89C8
    expect: "5aa31c02"
    data: "5aa32c02"
  # Settings save: callp pack -> pack trampoline
  - model: ms50g-3.10
    addr: 0xC00B9CF4
    expect: "93f13310"
    data: "1361ff1f"
  - model: ms50g-3.10
    addr: 0xC00B97E8
    expect: "00000000000000000000000000000000"
    data: "2a0c7500eac008006203000000800000"
    source: asm/midi_settings/pack_trampoline.S
  # Settings load at boot: callp unpack -> unpack trampoline
  - model: ms50g-3.10
    addr: 0xC00BA09C
    expect: "13603310"
    data: "93580710"
  - model: ms50g-3.10
    addr: 0xC00BDB44
    expect: "00000000000000000000000000000000"
    data: "2a107500eac008006203000000800000"
    source: asm/midi_settings/unpack_trampoline.S
  # Task_MIDI CC call site (midi-cc.yaml's trampoline) and PC call site
  # (stock midi_channel_msg) -> gate trampoline
  - model: ms50g-3.10
    addr: 0xC00AF088
    expect: "13710010"
    data: "93e50710"
  - model: ms50g-3.10
    addr: 0xC00AF0AC
    expect: "130bfe1f"
    data: "93e10710"
  - model: ms50g-3.10
    addr: 0xC00B2FAC
    expect: "00000000000000000000000000000000"
    data: "2a147500eac008006203000000800000"
    source: asm/midi_settings/gate_trampoline.S
section:
  # Handlers, tables and the flags word (base + 48), in free L2 after poll.S
  - model: ms50g-3.10
    addr: 0x1181EA00
    source: asm/midi_settings/settings.S
