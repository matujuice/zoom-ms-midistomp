# MIDI clock sets the patch tempo (issue #5) and publishes MIDI transport for
# custom effects (issue #24). MS-50G 3.10 OS only for now.
#   Incoming MIDI timing clock (0xF8, 24 per quarter note, any source over USB)
#   sets TEMPO like tap tempo does, so tempo-synced delay times and modulation
#   rates follow a DAW or drum machine.
#   The tempo follows after about 2 beats; a step of 1 BPM needs two matching
#   measurements (2 beats each), so jittery USB clock does not wobble it.
#   A tempo changed by hand while the clock runs is overridden on the next beat.
#   Start (0xFA), Stop (0xFC) and the clock count go to the transport block at
#   0x1181FF00 (docs/transport-block.md). Continue (0xFB) is ignored.
# Design and addresses: docs/os-reverse-engineering.md, "MIDI clock patch" and
# "MIDI transport block".
# The hex below is generated from asm/midi_clock/*.S with
#   zoomms asm <file> --addr <addr>   (add --section for a section)
# and tests/test_midi_clock_patch.py checks it still matches the source.
name: midi-clock
description: Patch tempo follows incoming MIDI clock; MIDI transport block for effects
builds: [ms50g-3.10]
write:
  # End of Task_MIDI's byte loop: ldw *+b14(224),b0 -> callp trampoline
  - model: ms50g-3.10
    addr: 0xC00AF0F8
    expect: "6e380000"
    data: "122ee51f"
  # Trampoline into L2 (the 16 zero bytes after a return)
  - model: ms50g-3.10
    addr: 0xC00A1A50
    expect: "00000000000000000000000000000000"
    data: "2a207000eac008006203000000800000"
    source: asm/midi_clock/trampoline.S
  # Task_SwitchNrmlSpdRead's 16 ms round: callp Clock_getTicks -> callp poll trampoline
  - model: ms50g-3.10
    addr: 0xC00CA630
    expect: "12a82910"
    data: "1246fb1f"
  # Poll trampoline into L2 (the 16 zero bytes after a return)
  - model: ms50g-3.10
    addr: 0xC00C8050
    expect: "00000000000000000000000000000000"
    data: "2a007400eac008006203000000800000"
    source: asm/midi_clock/poll_trampoline.S
