# MIDISTOMP V1.1: the VERSION menu entry reads "V1.1", and the boot screen
# prints "v1.1" under the MIDISTOMP MOD logo instead of the OS version.
name: version-1.1
description: VERSION entry reads "V1.1"; boot screen version line reads "v1.1"
replace:
  - find: "VERSION\0"
    with: "V1.1\0\0\0\0"
    count: 2   # the menu list and the version screen title
section:
  # "v1.1", in DDR the RAM test (#19) found unused
  - model: ms50g-3.10
    addr: 0xC00F2000
    data: "76312e3100000000"
  # MS-70CDR 2.10: the same free DDR (no OS reference above its image end 0xC00F1364)
  - model: ms70cdr-2.10
    addr: 0xC00F2000
    data: "76312e3100000000"
write:
  # Boot screen: sprintf(buf, "v%s", version) -> format = our "v1.1" string.
  # mvk/mvkh .S2 0xC00E4DB4,b0 -> 0xC00F2000 (keeps the mvkh parallel bit)
  - model: ms50g-3.10
    addr: 0xC00CD960
    expect: "2ada26006b076000"
    data: "2a001000eb076000"
  # MS-70CDR 2.10: the same code, mvk 0xC00E4914 ("v%s") -> 0xC00F2000
  - model: ms70cdr-2.10
    addr: 0xC00CD7C0
    expect: "2a8a24006b076000"
    data: "2a001000eb076000"
