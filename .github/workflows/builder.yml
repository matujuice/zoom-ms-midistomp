# Builds MIDISTOMP-builder-Windows.exe and the Mac builders (zips, one per Mac
# chip). None holds Zoom code: each user drops in Zoom's own updater. Running it
# by hand with release = vX.Y (or pushing tag vX.Y) publishes that release from
# this commit, notes from docs/releases/vX.Y.md; a release published by hand
# gets the builders attached. On pull requests they are workflow artifacts.
name: builder
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this release (e.g. v1.2); empty = build only"
        required: false
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --onefile --console --name MIDISTOMP-builder-Windows --add-data "patches;patches" --add-data "models;models" scripts/midistomp_builder.py
      - name: Refuses a file that is not the stock updater
        run: |
          '' | .\dist\MIDISTOMP-builder-Windows.exe README.md
          if ($LASTEXITCODE -ne 1) { exit 1 }
          if (Test-Path "MIDISTOMP V2.0 Updater.exe") { exit 1 }
          exit 0
      # Zoom's updater is downloaded here only to test; no upload contains it.
      - name: Builds from Zoom's updater, MS-60B picked in the window
        env:
          MIDISTOMP_TEST_PICK: ms60b
        run: |
          $z = "$env:RUNNER_TEMP\zoom"; New-Item -ItemType Directory $z | Out-Null
          curl.exe -sSfL -o "$z\w.zip" https://zoomcorp.com/documents/93/MS-70CDR_v2.10_Win_E.zip
          Expand-Archive "$z\w.zip" $z
          $u = Get-ChildItem $z -Recurse -Filter "ZOOM MS-70CDR v2.10 Updater.exe" | Select-Object -First 1
          '' | .\dist\MIDISTOMP-builder-Windows.exe $u.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($n in "MIDISTOMP V2.0 MS-60B Updater.exe", "MIDISTOMP V2.0 MS-60B Updater (360MHz OC).exe") {
            if (-not (Test-Path (Join-Path $u.DirectoryName $n))) { "missing $n"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MIDISTOMP-builder-Windows
          path: dist/MIDISTOMP-builder-Windows.exe
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            name: MIDISTOMP-builder-Mac-AppleSilicon
          - runner: macos-15-intel
            name: MIDISTOMP-builder-Mac-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --console --name ${{ matrix.name }} --add-data "patches:patches" --add-data "models:models" scripts/midistomp_builder.py
      - name: Refuses a file that is not the stock updater
        run: |
          set +e
          echo | ./dist/${{ matrix.name }} README.md
          test $? -eq 1 && test ! -e "MIDISTOMP V2.0 Updater.app"
      # Zoom's updater is downloaded here only to test; no upload contains it.
      - name: Builds from Zoom's Mac updater, MS-60B picked in the window
        env:
          MIDISTOMP_TEST_PICK: ms60b
        run: |
          z="$RUNNER_TEMP/zoom"; mkdir "$z"; cd "$z"
          curl -sSfL -o m.zip https://zoomcorp.com/documents/94/MS-70CDR_v2.10_Mac_E.zip && unzip -q m.zip
          app="$(find "$z" -maxdepth 4 -name 'ZOOM MS-70CDR v2.10 Updater.app' -not -path '*__MACOSX*' | head -1)"
          d="$(dirname "$app")"
          (sleep 1; screencapture -x "$GITHUB_WORKSPACE/pedal-window.png") &
          echo | "$GITHUB_WORKSPACE/dist/${{ matrix.name }}" "$app"
          for n in "MIDISTOMP V2.0 MS-60B Updater.app" "MIDISTOMP V2.0 MS-60B Updater (360MHz OC).app"; do
            codesign --verify --deep "$d/$n"
            test "$(xxd -p -s 0x2C00 -l 1 "$d/$n/Contents/Resources/Preset.bin")" = 5f   # MS-60B model byte
          done
          open "$d/MIDISTOMP V2.0 MS-60B Updater (360MHz OC).app"; sleep 6
          screencapture -x "$GITHUB_WORKSPACE/updater-window.png"
          pgrep -f "EFX Updater" || echo "::warning::the built updater did not stay open"
          pkill -f "EFX Updater" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.name }}   # not MIDISTOMP-builder-*, so the release doesn't get them
          path: "*.png"
          if-no-files-found: ignore
      - name: Zip it, keeping the program runnable
        run: cd dist && zip ${{ matrix.name }}.zip ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
  publish:
    needs: [windows, mac]
    if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MIDISTOMP-builder-*
          path: dist
          merge-multiple: true
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name != 'release'
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "MIDISTOMP MOD $TAG" --notes-file "docs/releases/$TAG.md"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
