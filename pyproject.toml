[project]
name = "zoomms"
dynamic = ["version"]
description = "Tools for modding Zoom MultiStomp MS-50G / MS-60B / MS-70CDR firmware and effects"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "pefile>=2023.2.7"]

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
zoomms = "zoomms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zoomms"]

[tool.setuptools.dynamic]
version = { attr = "zoomms.__version__" }
